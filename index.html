<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信息系统监理师 · 刷题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--card:#fff;--primary:#4f46e5;--primary-light:#e0e7ff;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px;font-weight:700}
.header .subtitle{font-size:12px;opacity:.8;margin-top:2px}

.tabs{display:flex;gap:4px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-bottom:1px solid var(--border)}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--bg);color:var(--text2);cursor:pointer;border:none;transition:all .2s}
.tab.active{background:var(--primary);color:#fff}
.tab .badge{font-size:11px;background:rgba(255,255,255,.3);padding:1px 6px;border-radius:10px;margin-left:4px}
.tab.active .badge{background:rgba(255,255,255,.3)}

.filters{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff}
.filter{flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;border:1px solid var(--border)}
.filter.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}

.progress{padding:8px 16px;font-size:12px;color:var(--text2);background:#fff;border-bottom:1px solid var(--border)}

.card{margin:12px 16px;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;transition:all .3s}
.card .q-header{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2)}
.card .q-header .tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-choice{background:#dbeafe;color:#2563eb}
.tag-text{background:#f3f4f6;color:#6b7280}
.tag-case{background:#fef3c7;color:#d97706}
.tag-judge{background:#ede9fe;color:#7c3aed}

.card .q-body{padding:4px 16px 16px}
.card .q-text{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.card .q-text .q-num{font-weight:700;color:var(--primary)}

.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .2s;text-align:left;font-size:14px;line-height:1.6}
.opt-btn:active{transform:scale(.98)}
.opt-btn .opt-label{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text2);transition:all .2s}
.opt-btn.correct{border-color:var(--success);background:#f0fdf4}
.opt-btn.correct .opt-label{background:var(--success);color:#fff}
.opt-btn.wrong{border-color:var(--danger);background:#fef2f2}
.opt-btn.wrong .opt-label{background:var(--danger);color:#fff}
.opt-btn.dimmed{opacity:.5}
.opt-btn .opt-text{flex:1;white-space:pre-wrap;word-break:break-all}

.answer-section{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f0fdf4;border-left:3px solid var(--success);font-size:14px;line-height:1.6}
.answer-section .ans-label{font-weight:700;color:var(--success);margin-bottom:4px}
.answer-section .ans-text{color:var(--text)}
.answer-section .analysis{margin-top:8px;padding-top:8px;border-top:1px dashed #bbf7d0;color:var(--text2);font-size:13px}

.bookmark-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
.bookmark-btn.active{color:var(--warning)}

.actions{display:flex;gap:8px;margin-top:14px}
.action-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-show{background:var(--primary-light);color:var(--primary)}
.btn-next{background:var(--primary);color:#fff}
.btn-next:active{background:#4338ca}

.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state p{font-size:14px}

.stats-bar{display:flex;justify-content:space-around;padding:12px 16px;background:#fff;border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:100}
.stat-item{text-align:center;font-size:11px;color:var(--text2)}
.stat-item .num{font-size:18px;font-weight:700;color:var(--text)}

.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card .q-body.text-content{white-space:pre-wrap;font-size:14px;line-height:1.8;color:#374151}
.case-content{white-space:pre-wrap;font-size:13px;line-height:1.8;color:#374151;max-height:400px;overflow-y:auto;padding:4px 16px 16px}

.q-nav{display:flex;justify-content:space-between;padding:12px 16px;gap:12px}
.q-nav button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.q-nav .prev-btn{background:var(--bg);color:var(--text)}
.q-nav .next-btn{background:var(--primary);color:#fff}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>
</head>
<body>
<div class="header">
  <h1>📐 信息系统监理师</h1>
  <div class="subtitle">刷题系统 · 考前冲刺</div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="quiz" onclick="switchTab('quiz')">选择题<span class="badge" id="choiceCount"></span></button>
  <button class="tab" data-tab="text" onclick="switchTab('text')">知识点<span class="badge" id="textCount"></span></button>
  <button class="tab" data-tab="cases" onclick="switchTab('cases')">案例<span class="badge" id="caseCount"></span></button>
  <button class="tab" data-tab="wrong" onclick="switchTab('wrong')">错题本<span class="badge" id="wrongCount">0</span></button>
  <button class="tab" data-tab="bookmarks" onclick="switchTab('bookmarks')">收藏<span class="badge" id="bmCount">0</span></button>
</div>

<div class="filters" id="filters"></div>
<div class="progress" id="progress"></div>

<div id="content"></div>

<div class="stats-bar" id="statsBar">
  <div class="stat-item"><div class="num" id="statDone">0</div>已做</div>
  <div class="stat-item"><div class="num" id="statCorrect" style="color:var(--success)">0</div>正确</div>
  <div class="stat-item"><div class="num" id="statWrong" style="color:var(--danger)">0</div>错误</div>
  <div class="stat-item"><div class="num" id="statRate">0%</div>正确率</div>
</div>

<script>
const STORAGE_KEY = 'jlxts_v3';
const TIME_ORDER = {'2025年5月':5,'2025年':4,'2024年11月':3,'2023年5月':2,'2019-2022年':1,'综合':0};

let state = loadState();
let exercises = [], cases = [];
let currentTab = 'quiz', currentTimeFilter = '', currentQIdx = 0, filteredList = [];

async function init() {
  try {
    const [eRes, cRes] = await Promise.all([
      fetch('data/exercises.json'),
      fetch('data/cases.json')
    ]);
    exercises = await eRes.json();
    cases = await cRes.json();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>数据加载失败，请检查网络连接</p></div>';
    return;
  }
  
  updateCounts();
  buildFilters();
  switchTab('quiz');
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function updateCounts() {
  const choiceQ = exercises.filter(e => e.type === 'choice' || e.type === 'multi-choice');
  const textQ = exercises.filter(e => e.type === 'text' || e.type === 'judge' || e.type === 'fill');
  document.getElementById('choiceCount').textContent = choiceQ.length;
  document.getElementById('textCount').textContent = textQ.length;
  document.getElementById('caseCount').textContent = cases.length;
  document.getElementById('wrongCount').textContent = (state.wrong || []).length;
  document.getElementById('bmCount').textContent = (state.bookmarks || []).length;
  updateStats();
}

function buildFilters() {
  const times = [...new Set(exercises.map(e => e.time_label).filter(Boolean))].sort((a,b) => (TIME_ORDER[b]||0)-(TIME_ORDER[a]||0));
  const container = document.getElementById('filters');
  container.innerHTML = '<button class="filter active" data-time="" onclick="filterTime(\'\')">全部</button>' +
    times.map(t => `<button class="filter" data-time="${t}" onclick="filterTime('${t}')">${t}</button>`).join('');
}

function filterTime(t) {
  currentTimeFilter = t;
  document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.time === t));
  currentQIdx = 0;
  renderList();
}

function getList() {
  if (currentTab === 'quiz') {
    let list = exercises.filter(e => e.type === 'choice' || e.type === 'multi-choice');
    if (currentTimeFilter) list = list.filter(e => e.time_label === currentTimeFilter);
    list.sort((a,b) => (TIME_ORDER[b.time_label]||0)-(TIME_ORDER[a.time_label]||0));
    return list;
  } else if (currentTab === 'text') {
    let list = exercises.filter(e => e.type !== 'choice' && e.type !== 'multi-choice' && e.type !== 'case-study');
    if (currentTimeFilter) list = list.filter(e => e.time_label === currentTimeFilter);
    list.sort((a,b) => (TIME_ORDER[b.time_label]||0)-(TIME_ORDER[a.time_label]||0));
    return list;
  } else if (currentTab === 'cases') {
    return cases;
  } else if (currentTab === 'wrong') {
    const ids = new Set(state.wrong || []);
    return exercises.filter(e => ids.has(e.id));
  } else if (currentTab === 'bookmarks') {
    const ids = new Set(state.bookmarks || []);
    return exercises.filter(e => ids.has(e.id)).concat(cases.filter(e => ids.has(e.id)));
  }
  return [];
}

function switchTab(tab) {
  currentTab = tab;
  currentQIdx = 0;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderList();
}

function renderList() {
  filteredList = getList();
  const container = document.getElementById('content');
  
  if (filteredList.length === 0) {
    const msgs = {quiz:'暂无选择题',text:'暂无知识点',cases:'暂无案例',wrong:'错题本为空，继续加油！',bookmarks:'还没有收藏的题目'};
    container.innerHTML = `<div class="empty-state"><div class="icon">${currentTab==='wrong'?'🎯':'📖'}</div><p>${msgs[currentTab]}</p></div>`;
    document.getElementById('progress').textContent = '';
    return;
  }
  
  const progress = `第 ${currentQIdx + 1} / ${filteredList.length} 题`;
  document.getElementById('progress').textContent = progress;
  
  const item = filteredList[currentQIdx];
  const done = state.done || {};
  const wrong = state.wrong || [];
  const bookmarks = state.bookmarks || [];
  const isDone = done[item.id];
  const isBookmarked = bookmarks.includes(item.id);
  const isCase = item.type === 'case-study';
  const isText = item.type === 'text' || item.type === 'fill' || item.type === 'judge';
  const hasOptions = item.options && item.options.length > 0;
  
  let tagClass = isCase ? 'tag-case' : hasOptions ? 'tag-choice' : 'tag-text';
  let tagText = isCase ? '案例' : item.type === 'multi-choice' ? '多选' : hasOptions ? '单选' : item.type === 'judge' ? '判断' : '知识点';
  
  let html = `<div class="card fade-in">`;
  html += `<div class="q-header"><span class="tag ${tagClass}">${tagText}</span><span>${item.time_label || ''} ${item.chapter ? '· '+item.chapter : ''}</span></div>`;
  html += `<div class="q-body" style="position:relative">`;
  
  if (hasOptions) {
    html += `<div class="q-text">${escapeHtml(item.question)}</div>`;
    html += `<div class="options">`;
    item.options.forEach((opt, i) => {
      let cls = 'opt-btn';
      if (isDone) {
        if (opt.label === item.answer) cls += ' correct';
        else if (state.answers && state.answers[item.id] === opt.label && opt.label !== item.answer) cls += ' wrong';
        else cls += ' dimmed';
      }
      html += `<button class="${cls}" onclick="selectAnswer('${item.id}','${opt.label}',this)" ${isDone?'disabled':''}>`;
      html += `<span class="opt-label">${opt.label}</span>`;
      html += `<span class="opt-text">${escapeHtml(opt.text)}</span></button>`;
    });
    html += `</div>`;
    
    if (isDone && item.answer) {
      html += `<div class="answer-section"><div class="ans-label">✅ 正确答案: ${escapeHtml(item.answer)}</div>`;
      if (state.answers && state.answers[item.id] && state.answers[item.id] !== item.answer) {
        html += `<div style="color:var(--danger);font-size:13px;margin-top:4px">❌ 你的答案: ${state.answers[item.id]}</div>`;
      }
      if (item.analysis) html += `<div class="analysis">💡 ${escapeHtml(item.analysis)}</div>`;
      html += `</div>`;
    } else if (isDone && !item.answer) {
      html += `<div class="answer-section"><div class="ans-label">✓ 已完成</div></div>`;
    } else {
      html += `<div class="actions">`;
      html += `<button class="action-btn btn-show" onclick="showAnswer('${item.id}')">显示答案</button>`;
      html += `<button class="action-btn btn-next" onclick="nextQuestion()">下一题 →</button>`;
      html += `</div>`;
    }
  } else {
    // Text/case content
    html += `<div class="${isCase ? 'case-content' : 'q-body text-content'}">${escapeHtml(isCase ? item.content : item.question)}</div>`;
    
    if (item.answer || item.analysis) {
      html += `<div class="answer-section">`;
      if (item.answer) html += `<div class="ans-label">✅ 参考答案</div><div class="ans-text">${escapeHtml(item.answer)}</div>`;
      if (item.analysis) html += `<div class="analysis">💡 ${escapeHtml(item.analysis)}</div>`;
      html += `</div>`;
    }
    
    if (!isDone && !isCase) {
      html += `<div class="actions"><button class="action-btn btn-show" onclick="markDone('${item.id}')">标记已读</button></div>`;
    }
  }
  
  // Bookmark
  html += `</div></div>`;
  
  // Navigation
  html += `<div class="q-nav">`;
  html += `<button class="prev-btn" onclick="prevQuestion()" ${currentQIdx===0?'disabled':''}>← 上一题</button>`;
  html += `<button class="next-btn" onclick="nextQuestion()" ${currentQIdx>=filteredList.length-1?'disabled':''}>下一题 →</button>`;
  html += `</div>`;
  
  container.innerHTML = html;
  
  // Add padding for bottom bar
  container.style.paddingBottom = '70px';
}

function selectAnswer(qid, label, btn) {
  if ((state.done || {})[qid]) return;
  
  const item = filteredList.find(e => e.id === qid) || exercises.find(e => e.id === qid);
  if (!item) return;
  
  if (!state.done) state.done = {};
  if (!state.answers) state.answers = {};
  if (!state.wrong) state.wrong = [];
  
  state.done[qid] = true;
  state.answers[qid] = label;
  
  const isCorrect = label === item.answer;
  if (!isCorrect && item.answer) {
    if (!state.wrong.includes(qid)) state.wrong.push(qid);
  }
  
  saveState();
  updateCounts();
  renderList();
}

function showAnswer(qid) {
  const item = filteredList.find(e => e.id === qid) || exercises.find(e => e.id === qid);
  if (!item) return;
  
  if (!state.done) state.done = {};
  if (!state.wrong) state.wrong = [];
  
  state.done[qid] = true;
  // Mark as wrong since user showed answer
  if (item.options && item.answer && !state.wrong.includes(qid)) {
    state.wrong.push(qid);
  }
  
  saveState();
  updateCounts();
  renderList();
}

function markDone(qid) {
  if (!state.done) state.done = {};
  state.done[qid] = true;
  saveState();
  updateCounts();
  nextQuestion();
}

function nextQuestion() {
  if (currentQIdx < filteredList.length - 1) { currentQIdx++; renderList(); }
  else { showToast('已经是最后一题了'); }
}
function prevQuestion() {
  if (currentQIdx > 0) { currentQIdx--; renderList(); }
}

function updateStats() {
  const done = state.done || {};
  const wrong = state.wrong || [];
  const answers = state.answers || {};
  const doneCount = Object.keys(done).length;
  
  let correct = 0, wrongCount = 0;
  for (const qid of Object.keys(done)) {
    const item = exercises.find(e => e.id === qid);
    if (item && item.answer && answers[qid]) {
      if (answers[qid] === item.answer) correct++;
      else wrongCount++;
    }
  }
  
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statRate').textContent = (correct + wrongCount) > 0 ? Math.round(correct/(correct+wrongCount)*100)+'%' : '0%';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;animation:fadeIn .2s';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Swipe navigation
let touchStartX = 0;
document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) {
    if (dx > 0) prevQuestion();
    else nextQuestion();
  }
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key >= '1' && e.key <= '4') {
    const btn = document.querySelectorAll('.opt-btn')[parseInt(e.key)-1];
    if (btn && !btn.disabled) btn.click();
  }
});

init();
</script>
</body>
</html>
