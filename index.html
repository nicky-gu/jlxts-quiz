<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信息系统监理师 · 刷题系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--card:#fff;--primary:#4f46e5;--primary-light:#e0e7ff;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px;font-weight:700}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:4px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border)}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--bg);color:var(--text2);cursor:pointer;border:none}
.tab.active{background:var(--primary);color:#fff}
.tab .n{font-size:11px;opacity:.7;margin-left:4px}

/* Filters */
.filters{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border)}
.fbtn{flex-shrink:0;padding:5px 12px;border-radius:14px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;border:1px solid var(--border)}
.fbtn.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}

/* Progress bar */
.progress-bar{height:3px;background:var(--border)}
.progress-bar .fill{height:100%;background:var(--primary);transition:width .3s}

/* Stats */
.stats{display:flex;justify-content:space-around;padding:10px 16px;background:#fff;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)}
.stats span b{color:var(--primary);font-size:14px}

/* Card */
.card{margin:12px 16px;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.card .q-top{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.card .q-tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-choice{background:#dbeafe;color:#2563eb}
.tag-multi{background:#fef3c7;color:#d97706}
.tag-text{background:#f1f5f9;color:#64748b}
.tag-judge{background:#dcfce7;color:#16a34a}
.tag-case{background:#ede9fe;color:#7c3aed}
.tag-knowledge{background:#fef9c3;color:#a16207}
.card .q-time{font-size:11px;color:var(--text2)}

.card .q-body{padding:8px 16px 14px}
.card .q-text{font-size:15px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;word-break:break-all}

/* Options */
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;border:2px solid var(--border);cursor:pointer;transition:all .2s;font-size:14px;line-height:1.5}
.opt:active{transform:scale(.98)}
.opt .lbl{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--text2);transition:all .2s}
.opt.selected{border-color:var(--primary);background:var(--primary-light)}
.opt.selected .lbl{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--success);background:#dcfce7}
.opt.correct .lbl{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:#fef2f2}
.opt.wrong .lbl{background:var(--danger);color:#fff}
.opt.disabled{pointer-events:none}

/* Answer reveal */
.answer-box{margin:10px 16px 14px;padding:12px 16px;border-radius:10px;background:#f0fdf4;border-left:4px solid var(--success);font-size:14px;line-height:1.7;display:none}
.answer-box.show{display:block}
.answer-box .ans-label{font-weight:700;color:var(--success);margin-bottom:4px}
.answer-box .ans-text{color:var(--text)}
.answer-box .analysis{margin-top:8px;padding-top:8px;border-top:1px solid #bbf7d0;color:var(--text2);font-size:13px}

/* Actions */
.actions{display:flex;gap:8px;padding:8px 16px 14px}
.act-btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;text-align:center}
.btn-know{background:#dcfce7;color:#16a34a}
.btn-know:active{background:#bbf7d0}
.btn-wrong{background:#fef2f2;color:#dc2626}
.btn-wrong:active{background:#fecaca}
.btn-bookmark{background:var(--primary-light);color:var(--primary)}
.btn-bookmark:active{background:#c7d2fe}
.btn-bookmark.saved{background:var(--primary);color:#fff}
.btn-nav{background:var(--bg);color:var(--text2);flex:0 0 auto;width:44px;padding:10px 0}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:16px}
.empty p{font-size:14px;line-height:1.6}

/* Wrong answer list */
.wrong-item{margin:8px 16px;padding:12px 16px;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.wrong-item .wi-q{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrong-item .wi-meta{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--text2)}

/* Nav buttons */
.nav-row{display:flex;gap:8px;padding:8px 16px 16px}
.nav-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;text-align:center}
.nav-prev{background:var(--bg);color:var(--text2)}
.nav-next{background:var(--primary);color:#fff}

.hidden{display:none!important}

/* Mobile adjustments */
@media(max-width:400px){
  .card .q-text{font-size:14px}
  .opt{font-size:13px;padding:8px 12px}
}
</style>
</head>
<body>

<div class="header">
  <h1>📋 信息系统监理师刷题</h1>
  <div class="sub" id="headerSub">加载中...</div>
</div>

<!-- Tabs -->
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="quiz">刷题<span class="n" id="quizCount"></span></button>
  <button class="tab" data-tab="wrong">错题本<span class="n" id="wrongCount"></span></button>
  <button class="tab" data-tab="bookmark">收藏<span class="n" id="bmCount"></span></button>
</div>

<!-- Filters -->
<div class="filters" id="filters">
  <button class="fbtn active" data-filter="all">全部</button>
  <button class="fbtn" data-filter="choice">选择题</button>
  <button class="fbtn" data-filter="multi-choice">多选题</button>
  <button class="fbtn" data-filter="knowledge">知识卡片</button>
  <button class="fbtn" data-filter="text">教材内容</button>
  <button class="fbtn" data-filter="case-study">案例分析</button>
</div>
<div class="filters" id="timeFilters">
  <button class="fbtn" data-time="">不限时间</button>
</div>

<!-- Progress -->
<div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
<div class="stats" id="statsBar">
  <span>进度 <b id="statDone">0</b>/<b id="statTotal">0</b></span>
  <span>正确率 <b id="statAcc">-</b></span>
  <span>今日 <b id="statToday">0</b>题</span>
</div>

<!-- Quiz view -->
<div id="quizView">
  <div class="card" id="card"></div>
  <div class="nav-row">
    <button class="nav-btn nav-prev" id="btnPrev" onclick="prevQ()">上一题</button>
    <button class="nav-btn nav-next" id="btnNext" onclick="nextQ()">下一题</button>
  </div>
</div>

<!-- Wrong answer view -->
<div id="wrongView" class="hidden">
  <div id="wrongList"></div>
  <div class="empty hidden" id="wrongEmpty">
    <div class="icon">🎉</div>
    <p>没有错题，继续保持！</p>
  </div>
</div>

<!-- Bookmark view -->
<div id="bmView" class="hidden">
  <div id="bmList"></div>
  <div class="empty hidden" id="bmEmpty">
    <div class="icon">⭐</div>
    <p>还没有收藏的题目</p>
  </div>
</div>

<script>
const STORAGE_KEY = 'jlxts_v3';
const TIME_ORDER = {'2025年5月':5,'2025年':4,'2024年11月':3,'2023年5月':2,'2019-2022年':1,'综合':0};

let allExercises = [], allCases = [];
let filtered = [];
let currentIdx = 0;
let state = { wrong: [], bookmarks: [], done: [], todayCount: 0, todayDate: '' };

// ========== Init ==========
async function init() {
  try {
    const [eRes, cRes] = await Promise.all([
      fetch('data/exercises.json'),
      fetch('data/cases.json')
    ]);
    allExercises = await eRes.json();
    allCases = await cRes.json();
  } catch(e) {
    document.getElementById('card').innerHTML = '<div class="empty"><div class="icon">❌</div><p>数据加载失败，请刷新重试</p></div>';
    return;
  }

  loadState();
  updateTimeFilters();
  applyFilter('all', '');
  bindTabs();

  document.getElementById('headerSub').textContent = `共 ${allExercises.length} 题 + ${allCases.length} 案例`;
  updateStats();
  renderQ();
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state.wrong = saved.wrong || [];
    state.bookmarks = saved.bookmarks || [];
    state.done = saved.done || [];
    state.todayCount = (saved.todayDate === todayStr()) ? (saved.todayCount || 0) : 0;
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    wrong: state.wrong,
    bookmarks: state.bookmarks,
    done: state.done,
    todayCount: state.todayCount,
    todayDate: todayStr()
  }));
}

function todayStr() { return new Date().toISOString().slice(0,10); }

// ========== Tabs ==========
function bindTabs() {
  document.querySelectorAll('#tabs .tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#tabs .tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('quizView').classList.toggle('hidden', tab !== 'quiz');
      document.getElementById('wrongView').classList.toggle('hidden', tab !== 'wrong');
      document.getElementById('bmView').classList.toggle('hidden', tab !== 'bookmark');
      if (tab === 'wrong') renderWrongList();
      if (tab === 'bookmark') renderBmList();
    };
  });

  // Type filters
  document.querySelectorAll('#filters .fbtn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#filters .fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.filter, currentFilterTime());
    };
  });
}

function currentFilterTime() {
  const active = document.querySelector('#timeFilters .fbtn.active');
  return active ? active.dataset.time : '';
}

function updateTimeFilters() {
  const times = [...new Set(allExercises.map(e => e.time_label).filter(Boolean))];
  times.sort((a,b) => (TIME_ORDER[b]||0) - (TIME_ORDER[a]||0));
  const container = document.getElementById('timeFilters');
  container.innerHTML = '<button class="fbtn active" data-time="">不限时间</button>';
  times.forEach(t => {
    const count = allExercises.filter(e => e.time_label === t).length;
    const btn = document.createElement('button');
    btn.className = 'fbtn';
    btn.dataset.time = t;
    btn.textContent = `${t} (${count})`;
    container.appendChild(btn);
  });
  container.querySelectorAll('.fbtn').forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(currentFilterType(), btn.dataset.time);
    };
  });
}

function currentFilterType() {
  const active = document.querySelector('#filters .fbtn.active');
  return active ? active.dataset.filter : 'all';
}

function applyFilter(type, time) {
  filtered = allExercises.filter(e => {
    if (type !== 'all' && e.type !== type) return false;
    if (time && e.time_label !== time) return false;
    return true;
  });
  // Sort: newest first
  filtered.sort((a,b) => (TIME_ORDER[b.time_label]||0) - (TIME_ORDER[a.time_label]||0));

  // Skip done items (if enabled)
  currentIdx = 0;
  if (filtered.length === 0) {
    document.getElementById('card').innerHTML = '<div class="empty"><div class="icon">📭</div><p>该分类下暂无题目</p></div>';
  } else {
    renderQ();
  }
  updateStats();
}

// ========== Render Question ==========
function renderQ() {
  if (filtered.length === 0) return;
  const q = filtered[currentIdx];
  if (!q) return;

  const isWrong = state.wrong.includes(q.id);
  const isBm = state.bookmarks.includes(q.id);
  const isDone = state.done.includes(q.id);

  const tagClass = q.type === 'choice' ? 'tag-choice' : q.type === 'multi-choice' ? 'tag-multi' : q.type === 'judge' ? 'tag-judge' : q.type === 'case-study' ? 'tag-case' : q.type === 'knowledge' ? 'tag-knowledge' : 'tag-text';
  const tagText = q.type === 'choice' ? '单选' : q.type === 'multi-choice' ? '多选' : q.type === 'judge' ? '判断' : q.type === 'case-study' ? '案例' : q.type === 'knowledge' ? '知识' : '文本';

  let html = `<div class="q-top"><span class="q-tag ${tagClass}">${tagText}</span><span class="q-time">${q.time_label || ''}</span></div>`;
  html += `<div class="q-body">`;
  html += `<div class="q-text">${escHtml(q.question)}</div>`;

  if (q.options && q.options.length > 0) {
    html += `<div class="options" id="opts">`;
    q.options.forEach((o, i) => {
      html += `<div class="opt" data-label="${o.label}" onclick="selectOpt(this,'${o.label}','${escAttr(q.answer||'')}')">
        <span class="lbl">${o.label}</span>
        <span>${escHtml(o.text)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (q.answer || q.analysis) {
    html += `<div class="answer-box" id="ansBox">
      ${q.answer ? `<div class="ans-label">✅ 参考答案：${escHtml(q.answer)}</div>` : ''}
      ${q.analysis ? `<div class="analysis">📖 ${escHtml(q.analysis)}</div>` : ''}
    </div>`;
  }

  // Action buttons
  html += `<div class="actions">`;
  if (q.options && q.options.length > 0) {
    html += `<button class="act-btn btn-know" onclick="markKnown()">知道了</button>`;
    html += `<button class="act-btn btn-wrong" onclick="markWrong()">做错了</button>`;
  }
  html += `<button class="act-btn btn-bookmark ${isBm?'saved':''}" onclick="toggleBm()">${isBm?'⭐ 已收藏':'☆ 收藏'}</button>`;
  html += `</div>`;
  html += `</div>`;

  document.getElementById('card').innerHTML = html;
  document.getElementById('progressFill').style.width = `${((currentIdx+1)/filtered.length)*100}%`;

  // Show answer if already done
  if (isDone && q.answer) {
    showAnswer();
  }

  updateStats();
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ========== Interaction ==========
function selectOpt(el, label, correctAnswer) {
  const opts = document.querySelectorAll('#opts .opt');
  if (el.classList.contains('disabled')) return;

  // Disable all
  opts.forEach(o => o.classList.add('disabled'));

  const isCorrect = correctAnswer && correctAnswer.toUpperCase().includes(label.toUpperCase());
  if (isCorrect) {
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    // Highlight correct answer
    opts.forEach(o => {
      if (correctAnswer && correctAnswer.toUpperCase().includes(o.dataset.label.toUpperCase())) {
        o.classList.add('correct');
      }
    });
  }

  // Track
  if (!state.done.includes(filtered[currentIdx].id)) {
    state.done.push(filtered[currentIdx].id);
    state.todayCount++;
  }
  if (!isCorrect && !state.wrong.includes(filtered[currentIdx].id)) {
    state.wrong.push(filtered[currentIdx].id);
  } else if (isCorrect) {
    state.wrong = state.wrong.filter(id => id !== filtered[currentIdx].id);
  }
  saveState();

  // Show answer
  if (filtered[currentIdx].answer || filtered[currentIdx].analysis) {
    showAnswer();
  }
  updateStats();

  // Auto advance after delay
  setTimeout(() => {
    if (currentIdx < filtered.length - 1) {
      currentIdx++;
      renderQ();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  }, isCorrect ? 1200 : 3000);
}

function showAnswer() {
  const box = document.getElementById('ansBox');
  if (box) box.classList.add('show');
}

function markKnown() {
  const q = filtered[currentIdx];
  if (q && !state.done.includes(q.id)) {
    state.done.push(q.id);
    state.todayCount++;
  }
  state.wrong = state.wrong.filter(id => id !== q.id);
  saveState();
  showAnswer();
  updateStats();
}

function markWrong() {
  const q = filtered[currentIdx];
  if (q) {
    if (!state.done.includes(q.id)) {
      state.done.push(q.id);
      state.todayCount++;
    }
    if (!state.wrong.includes(q.id)) state.wrong.push(q.id);
  }
  saveState();
  showAnswer();
  updateStats();
}

function toggleBm() {
  const q = filtered[currentIdx];
  if (!q) return;
  if (state.bookmarks.includes(q.id)) {
    state.bookmarks = state.bookmarks.filter(id => id !== q.id);
  } else {
    state.bookmarks.push(q.id);
  }
  saveState();
  renderQ(); // Re-render to update button state
  updateStats();
}

function prevQ() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQ();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function nextQ() {
  if (currentIdx < filtered.length - 1) {
    currentIdx++;
    renderQ();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

// ========== Wrong / Bookmark Lists ==========
function findQ(id) {
  return allExercises.find(e => e.id === id) || allCases.find(e => e.id === id);
}

function renderWrongList() {
  const list = document.getElementById('wrongList');
  const empty = document.getElementById('wrongEmpty');
  const items = state.wrong.map(id => findQ(id)).filter(Boolean);
  if (items.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = items.map(q => `
    <div class="wrong-item" onclick="goToQ('${q.id}')">
      <div class="wi-q">${escHtml(q.question).substring(0, 100)}...</div>
      <div class="wi-meta">
        <span>${q.time_label || ''}</span>
        ${q.answer ? `<span>答案: ${escHtml(q.answer)}</span>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('wrongCount').textContent = ` (${items.length})`;
}

function renderBmList() {
  const list = document.getElementById('bmList');
  const empty = document.getElementById('bmEmpty');
  const items = state.bookmarks.map(id => findQ(id)).filter(Boolean);
  if (items.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = items.map(q => `
    <div class="wrong-item" onclick="goToQ('${q.id}')">
      <div class="wi-q">${escHtml(q.question).substring(0, 100)}...</div>
      <div class="wi-meta"><span>${q.time_label || ''}</span></div>
    </div>
  `).join('');
  document.getElementById('bmCount').textContent = ` (${items.length})`;
}

function goToQ(id) {
  // Switch to quiz tab
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="quiz"]').classList.add('active');
  document.getElementById('quizView').classList.remove('hidden');
  document.getElementById('wrongView').classList.add('hidden');
  document.getElementById('bmView').classList.add('hidden');

  // Find in filtered
  const idx = filtered.findIndex(e => e.id === id);
  if (idx >= 0) {
    currentIdx = idx;
  } else {
    // Not in current filter, switch to all
    document.querySelectorAll('#filters .fbtn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-filter="all"]').classList.add('active');
    applyFilter('all', '');
    const idx2 = filtered.findIndex(e => e.id === id);
    if (idx2 >= 0) currentIdx = idx2;
  }
  renderQ();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ========== Stats ==========
function updateStats() {
  const total = filtered.length;
  const done = filtered.filter(e => state.done.includes(e.id)).length;
  const wrongFromFiltered = filtered.filter(e => state.wrong.includes(e.id)).length;
  const correct = done - wrongFromFiltered;
  const acc = done > 0 ? Math.round((correct / done) * 100) + '%' : '-';

  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAcc').textContent = acc;
  document.getElementById('statToday').textContent = state.todayCount;
  document.getElementById('quizCount').textContent = ` (${allExercises.length})`;
  document.getElementById('wrongCount').textContent = ` (${state.wrong.length})`;
  document.getElementById('bmCount').textContent = ` (${state.bookmarks.length})`;
}

// ========== Start ==========
init();
</script>
</body>
</html>
